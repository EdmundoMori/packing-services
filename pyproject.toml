[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packing-services"
version = "0.1.0"
description = "Comparar metodologías de Cutting and Packing sobre la misma entrada, el mismo validador y las mismas métricas (packing_mode=offline y packing_mode=online). No es un algoritmo óptimo ni un espacio de datos."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "packing-services" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Adaptadores opcionales. py3dbp habilita el baseline externo en Python puro.
py3dbp = ["py3dbp>=1.1"]
# Notebooks didácticos (demos visuales para presentar el avance).
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "plotly>=5.18",
    "numpy>=1.24",
]
# Entrenamiento / inferencia de política online mlp_v1 (no es dependencia base).
torch = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
