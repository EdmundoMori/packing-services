[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packing-services"
version = "0.1.0"
description = "Servicios modulares e independientes para problemas de Cutting and Packing (3D-BPP, Container Loading, Cartonization, Palletization, Stacking-aware, Validation, Benchmark)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "packing-services" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Adaptadores opcionales. py3dbp habilita el baseline externo en Python puro.
py3dbp = ["py3dbp>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
