services:
  packing-demo:
    build:
      context: ..
      dockerfile: web-demo/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PACKING_API_PORT: "8000"
      WEB_DEMO_PORT: "8080"
      PACKING_API_HOST: "127.0.0.1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/demo/health"]
      interval: 10s
      timeout: 5s
      retries: 5
